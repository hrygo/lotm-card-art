name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check scaffold
        run: python tools/cardctl.py check --level scaffold
      - name: Check contract pins
        run: python tools/pin_seal.py --check
      - name: Check design tokens
        run: python tools/design_tokens.py check
      - name: Report artifact size (advisory)
        if: matrix.python-version == '3.13'
        run: python tools/production.py report-asset-size
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  native:
    name: Native renderer + client (macOS 26)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run native renderer tests without skipping
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_fool_agentic_pipeline tests.test_native_compositor -v 2>&1 | tee native-tests.log
          if grep -q "skipped" native-tests.log; then
            echo "::error::native renderer tests were skipped — Swift toolchain missing on the runner"
            exit 1
          fi
      - name: Run client tests
        working-directory: apps/WorldOfMysteries
        run: swift test
