name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Toolchain (Python ${{ matrix.python-version }}) · macOS
    # 本仓库是 macOS-only：工具链直接调用系统 `sips` 等 macOS 专有工具，
    # 因此不设 Linux 任务；版本矩阵只保留声明的最低版本（3.10）与当前版本（3.14）。
    runs-on: macos-26
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check scaffold
        run: python tools/cardctl.py check --level scaffold
      - name: Check contract pins
        run: python tools/pin_seal.py --check
      - name: Check design tokens
        run: python tools/design_tokens.py check
      - name: Report artifact size (advisory)
        if: matrix.python-version == '3.14'
        run: python tools/production.py report-asset-size
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  native:
    name: Native renderer + client (macOS 26)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run macOS-toolchain tests without skipping
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_fool_agentic_pipeline tests.test_native_compositor \
            tests.test_app_image_staging tests.test_fool_card_validation -v 2>&1 | tee native-tests.log
          if grep -q "skipped" native-tests.log; then
            echo "::error::macOS-only tests were skipped — Swift/sips toolchain missing on the runner"
            exit 1
          fi
      - name: Run client tests
        working-directory: apps/WorldOfMysteries
        run: swift test
