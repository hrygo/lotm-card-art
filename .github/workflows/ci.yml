name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Toolchain (Python ${{ matrix.python-version }}) · macOS
    # 本仓库是 macOS-only：工具链直接调用系统 `sips` 等 macOS 专有工具，
    # 因此不设 Linux 任务；版本矩阵只保留声明的最低版本（3.10）与当前版本（3.14）。
    runs-on: macos-26
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check scaffold
        run: python tools/cardctl.py check --level scaffold
      - name: Check contract pins
        run: python tools/pin_seal.py --check
      - name: Check design tokens
        run: python tools/design_tokens.py check
      - name: Check required-check name contract
        # 分支保护按检查名匹配：改了必需检查名会让所有 PR 永久 pending。
        # 本步骤在不受保护的 test 任务里先亮红，聚合门禁再兜底阻断合入。
        run: python tools/check_required_checks.py
      - name: Report artifact size (advisory)
        if: matrix.python-version == '3.14'
        run: python tools/production.py report-asset-size
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  native:
    name: Native renderer + client (macOS 26)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run macOS-toolchain tests without skipping
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_fool_agentic_pipeline tests.test_native_compositor \
            tests.test_app_image_staging tests.test_fool_card_validation -v 2>&1 | tee native-tests.log
          if grep -q "skipped" native-tests.log; then
            echo "::error::macOS-only tests were skipped — Swift/sips toolchain missing on the runner"
            exit 1
          fi
      - name: Run client tests
        working-directory: apps/WorldOfMysteries
        run: swift test

  gate:
    # 这是 main 分支保护在 GitHub 上唯一要求的必需检查名（见 .github/required-checks.json）。
    # 名字里不含矩阵版本号：改 Python 版本矩阵不会让 PR 卡在等待一个永不出现的检查上。
    name: All Quality Gates Passed
    needs: [test, native]
    if: always()
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Assert the required-check name contract still holds
        run: python tools/check_required_checks.py
      - name: Assert every upstream job succeeded
        env:
          UPSTREAM_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "上游任务结果：$UPSTREAM_RESULTS"
          for result in $UPSTREAM_RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::上游任务未全部成功（$UPSTREAM_RESULTS），聚合门禁不通过"
              exit 1
            fi
          done
          echo "全部上游任务成功"
